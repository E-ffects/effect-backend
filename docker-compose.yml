# 로컬 개발용 PostgreSQL + Redis
#   docker compose up -d     # 실행
#   docker compose down      # 중지 (데이터 유지)
#   docker compose down -v   # 중지 + 데이터 삭제

services:
  postgres:
    image: postgres:17-alpine
    container_name: effect-postgres
    environment:
      POSTGRES_DB: effect
      POSTGRES_USER: effect
      POSTGRES_PASSWORD: effect
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5433:5432" # 호스트 5432는 로컬에 설치된 PostgreSQL과 겹칠 수 있어 5433 사용
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effect -d effect"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: effect-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

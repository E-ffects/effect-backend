# 공통 설정 (모든 프로필)
# 프로필별 값은 application-local.yml / application-prod.yml

spring:
  application:
    name: effect
  profiles:
    default: local

  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 222MB

jwt:
  access-token-ttl: 30m
  refresh-token-ttl: 7d
  cookie-secure: true

server:
  port: 8000
  servlet:
    context-path: /api
  shutdown: graceful
  forward-headers-strategy: framework

# Actuator는 8081 포트로 분리
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: local

app:
  clock:
    fixed: "2025-12-31T09:00:00+09:00"

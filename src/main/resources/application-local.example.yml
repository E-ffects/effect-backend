# 로컬 개발 설정 예시
# 이 파일을 복사해 application-local.yml 을 만든다 (application-local.yml 은 git에 올리지 않는다).

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/effect
    username: effect
    password: effect

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.u1_2.effect: DEBUG

jwt:
  secret: local-dev-only-secret-change-me-0123456789
  cookie-secure: false

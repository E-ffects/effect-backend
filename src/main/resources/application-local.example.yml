# 로컬 개발 설정 예시
# 이 파일을 복사해 application-local.yml 을 만든다 (application-local.yml 은 git에 올리지 않는다).
#   cp src/main/resources/application-local.example.yml src/main/resources/application-local.yml
# DB·Redis는 프로젝트 루트에서: docker compose up -d

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/effect
    username: effect
    password: effect

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.u1_2.effect: DEBUG

jwt:
  secret: local-dev-only-secret-change-me-0123456789
  cookie-secure: false # local은 http라 Secure 쿠키가 저장되지 않음
